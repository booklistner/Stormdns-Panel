<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StormDNS Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:'Vazirmatn',sans-serif;
  background:#070b14;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.bg-grid {
  position:fixed; inset:0;
  background-image:linear-gradient(rgba(59,130,246,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,0.03) 1px,transparent 1px);
  background-size:40px 40px;
}
.glow {
  position:fixed;
  width:500px; height:500px;
  background:radial-gradient(circle,rgba(59,130,246,0.08) 0%,transparent 70%);
  top:-100px; right:-100px;
  border-radius:50%;
  pointer-events:none;
}
.box {
  position:relative; z-index:10;
  background:rgba(15,22,35,0.9);
  border:1px solid rgba(59,130,246,0.15);
  border-radius:20px;
  padding:44px 36px;
  width:360px;
  backdrop-filter:blur(20px);
  box-shadow:0 0 60px rgba(0,0,0,0.5);
}
.logo { text-align:center; margin-bottom:32px; }
.logo-icon {
  width:60px; height:60px;
  background:linear-gradient(135deg,#3b82f6,#06b6d4);
  border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 14px;
  font-size:26px;
  box-shadow:0 8px 24px rgba(59,130,246,0.3);
}
.logo h1 { color:#fff; font-size:20px; font-weight:700; }
.logo p { color:rgba(255,255,255,0.35); font-size:12px; margin-top:4px; }
label { display:block; color:rgba(255,255,255,0.5); font-size:12px; margin-bottom:7px; }
input[type=password] {
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:10px;
  padding:11px 14px;
  color:#fff; font-size:14px;
  font-family:'Vazirmatn',sans-serif;
  outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
input[type=password]:focus {
  border-color:rgba(59,130,246,0.5);
  box-shadow:0 0 0 3px rgba(59,130,246,0.1);
}
.form-group { margin-bottom:18px; }
.btn-login {
  width:100%;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  border:none; border-radius:10px;
  padding:12px; color:#fff;
  font-size:14px; font-family:'Vazirmatn',sans-serif; font-weight:600;
  cursor:pointer; transition:opacity 0.2s,transform 0.1s;
  margin-top:4px;
  box-shadow:0 4px 14px rgba(59,130,246,0.3);
}
.btn-login:hover { opacity:0.9; }
.btn-login:active { transform:scale(0.98); }
.error {
  background:rgba(239,68,68,0.08);
  border:1px solid rgba(239,68,68,0.2);
  border-radius:8px; padding:10px 14px;
  color:#f87171; font-size:12px;
  margin-bottom:16px; text-align:center;
}
.security-note { text-align:center; margin-top:20px; color:rgba(255,255,255,0.2); font-size:11px; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="glow"></div>
<div class="box">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <h1>StormDNS Panel</h1>
    <p>سیستم مدیریت امن</p>
  </div>
  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
  <form method="POST" autocomplete="off">
    <div class="form-group">
      <label>رمز عبور ادمین</label>
      <input type="password" name="password" placeholder="••••••••" autofocus autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login">ورود به پنل</button>
  </form>
  <div class="security-note">🔒 اتصال امن • StormDNS v1.0</div>
</div>
</body>
</html>
